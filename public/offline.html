<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="@2026-Alifiandra">
<title>Sedang offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #FAF7F2; color: #1C1917; padding: 16px; }
  .box { max-width: 420px; text-align: center; background: #fff; border: 1px solid #E7E0D6; border-radius: 16px; padding: 28px 22px; box-shadow: 0 4px 16px rgb(0 0 0 / .05); }
  .ic { width: 56px; height: 56px; border-radius: 14px; background: #C2410C; color: #fff; display: grid; place-items: center; margin: 0 auto 14px; font-size: 28px; }
  h1 { font-size: 20px; margin: 0 0 8px; } p { color: #6b625a; line-height: 1.5; margin: 0 0 16px; }
  button { padding: 11px 18px; border-radius: 10px; border: 0; background: #C2410C; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #12100E; color: #F5F0EA; } .box { background: #1C1917; border-color: #34302B; } p { color: #b3aba2; } }
</style>
</head>
<body>
<div class="box">
  <div class="ic">⚡</div>
  <h1>Anda sedang offline</h1>
  <p>Halaman ini butuh koneksi internet. Pesanan, pembayaran, dan absensi hanya tercatat setelah terkirim ke server, jadi tidak ada transaksi yang dianggap berhasil saat offline.</p>
  <button onclick="location.reload()">Coba lagi</button>
</div>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
